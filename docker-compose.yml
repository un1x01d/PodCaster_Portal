services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tforn_insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tforn_insights_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tforn_insights_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://tforn_insights:tforn_insights_pass@db:5432/tforn_insights_db}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-2026-rotate-me-7f3b9c1d5a8e4b2f9d6c0a1e3f5b7d9}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_INPUT_COST_PER_1M: ${GEMINI_INPUT_COST_PER_1M:-0}
      GEMINI_OUTPUT_COST_PER_1M: ${GEMINI_OUTPUT_COST_PER_1M:-0}
      ALLOW_OLLAMA_PROVIDER: ${ALLOW_OLLAMA_PROVIDER:-false}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_INPUT_COST_PER_1M: ${OLLAMA_INPUT_COST_PER_1M:-0}
      OLLAMA_OUTPUT_COST_PER_1M: ${OLLAMA_OUTPUT_COST_PER_1M:-0}
      CHAT_MAX_ROWS: ${CHAT_MAX_ROWS:-50000}
      CHAT_SAMPLE_ROWS: ${CHAT_SAMPLE_ROWS:-120}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/scripts:/app/scripts
      - ./backend/src:/app/src
      - ./backend/server.js:/app/server.js
    command: npm start
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'require(\"net\").createConnection(4000, \"localhost\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000   # baked into the build
    environment:
      NODE_ENV: development
    user: "0:0"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e 'require(\"net\").createConnection(5173, \"localhost\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  db_data:
