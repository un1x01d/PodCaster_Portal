version: "3.9"

services:
  backend:
    image: "${BACKEND_IMAGE_REPO:?BACKEND_IMAGE_REPO required}:${RELEASE_TAG:?RELEASE_TAG required}"
    container_name: podcaster_backend
    restart: unless-stopped
    env_file:
      - ./config/backend.env
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - podcaster_internal

  frontend:
    image: "${FRONTEND_IMAGE_REPO:?FRONTEND_IMAGE_REPO required}:${RELEASE_TAG:?RELEASE_TAG required}"
    container_name: podcaster_frontend
    restart: unless-stopped
    env_file:
      - ./config/frontend.env
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - podcaster_internal

networks:
  podcaster_internal:
    driver: bridge
