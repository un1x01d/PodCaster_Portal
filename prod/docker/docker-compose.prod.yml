version: "3.9"

services:
  backend:
    image: "${BACKEND_IMAGE_REPO:-tforn-insights-backend}:${RELEASE_TAG:-latest}"
    container_name: tforn_insights_backend
    restart: unless-stopped
    env_file:
      - ./config/backend.env
    ports:
      - "127.0.0.1:4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tforn_insights_internal

  frontend:
    image: "${FRONTEND_IMAGE_REPO:-tforn-insights-frontend}:${RELEASE_TAG:-latest}"
    container_name: tforn_insights_frontend
    restart: unless-stopped
    env_file:
      - ./config/frontend.env
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - tforn_insights_internal

networks:
  tforn_insights_internal:
    driver: bridge
